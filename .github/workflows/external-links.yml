name: External links

# Relative links are checked on every push by tools/check_wiki.py.
# This checks links to other sites once a week and opens an issue when one breaks.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: [self-hosted, laplace, Laplace-Wiki]
    steps:
      - uses: actions/checkout@v7
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path .site-src --exclude-path site --exclude-path Repositories "./**/*.md"
          fail: false
      - if: steps.lychee.outputs.exit_code != 0
        name: Maintain one external-reference issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          report=./lychee/out.md
          test -s "$report"
          printf '\n[Workflow evidence](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$report"
          title='External link verification'
          issue=$(gh issue list --state open --label links --search '"External link verification" in:title' --limit 1 --json number --jq '.[0].number // empty')
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --title "$title" --body-file "$report"
          else
            gh issue create --title "$title" --body-file "$report" --label links
          fi
